{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión</title>
    <link rel="stylesheet" href="{% static 'styles/login.css' %}">
</head>

<body>
    <main class="page">

        <!-- Lado visual / branding -->
        <section class="left">
            <div class="overlay">
                <h1>Welcome Back</h1>
                <p>Access your account and manage everything from one place.</p>
            </div>
        </section>

        <!-- Lado del formulario -->
        <section class="right">
            <div class="form-container">
                <p class="title">Login</p>

                <form method="post" class="form">
                    {% csrf_token %}
                    <div class="input-group">
                        <label for="username">Username</label>
                        <input type="text" name="username" id="username" required>
                    </div>

                    <div class="input-group">
                        <label for="password">Password</label>
                        <input type="password" name="password" id="password" required>
                        <div class="forgot">
                            <a href="#">Forgot Password?</a>
                        </div>
                    </div>

                    <button type="submit" class="sign">Sign in</button>
                </form>

                <div class="social-message">
                    <div class="line"></div>
                    <p class="message">Login with social accounts</p>
                    <div class="line"></div>
                </div>

                <div class="social-icons">
                    <button class="icon">
                        <img src="{% static 'icons/google.svg' %}" alt="Google">
                    </button>
                    <button class="icon">
                        <img src="{% static 'icons/twitter.svg' %}" alt="Twitter">
                    </button>
                    <button class="icon">
                        <img src="{% static 'icons/github.svg' %}" alt="GitHub">
                    </button>
                </div>

                <p class="signup">
                    Don't have an account?
                    <a href="{% url 'register' %}">Sign up</a>
                </p>
            </div>
        </section>

    </main>
</body>

</html>
