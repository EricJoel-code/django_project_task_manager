{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'styles/home/home.css' %}">
</head>

<body class="min-vh-100">

    <div class="d-flex min-vh-100">

        <!-- SIDEBAR -->
        <aside class="bg-dark text-light p-3" style="width: 240px;">
            <h5 class="mb-4">📌 Proyectos</h5>

            <ul class="nav nav-pills flex-column gap-2">
                <li class="nav-item">
                    <a class="nav-link text-light" href="{% url 'home' %}">🏠 Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-light" href="{% url 'projects_list' %}">📁 Projects</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-light" href="{% url 'tasks_list' %}">📋 Tasks</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-light" href="{% url 'add_project' %}">➕ Add Project</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-light" href="{% url 'add_task' %}">➕ Add Task</a>
                </li>
                {% if user.is_authenticated %}
                <li class="nav-item">
                    <a class="dropdown-item" href="{% url 'logout' %}">
                        <i class="fas fa-sign-out-alt"></i> Cerrar sesión
                    </a>
                </li>
                {% endif %}
            </ul>
        </aside>

        <!-- CONTENIDO + FOOTER -->
        <div class="d-flex flex-column flex-grow-1">

            <main class="p-4 flex-grow-1">
                {% block content %}
                {% endblock %}
            </main>



        </div>

    </div>

</body>

</html>
