{% extends "layouts/base.html" %}
{% block content %}

<head>
    <title>Proyectos</title>
</head>

<h1>Proyectos</h1>

<table class="table table-striped">
    <thead>
        <tr>
            <th scope="col">ID</th>
            <th scope="col">NAME</th>
        </tr>
    </thead>
    <tbody>
        {% for project in projects %}
        <tr>
            <th scope="row">{{ project.id }}</th>
            <td>{{ project.name }}</td>
        </tr>
        {% endfor %}
</table>


{% endblock %}
